name: hackcity

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hackcity
      POSTGRES_PASSWORD: hackcity
      POSTGRES_DB: hackcity
    # Host port only: the api talks to db:5432 over the compose network. Set DB_PORT in .env
    # when the machine already runs Postgres on 5432, or the container cannot bind.
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackcity"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes:
      - ./backend:/code            # hot reload
      - ../datasets:/data:ro       # supplied data is read-only
      - uploads:/uploads           # pickup photos
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build: ./frontend
    depends_on: [api]
    ports: ["5173:5173"]
    environment:
      API_TARGET: http://api:8000
      ANALYTICS_TARGET: http://analytics:8100
      VITE_USE_MOCKS: ${VITE_USE_MOCKS:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

  # --- data analysis (separate, persistent, PostGIS) ---
  analytics-db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports: ["5433:5432"]
    volumes: [analytics_pgdata:/var/lib/postgresql/data]
    command: postgres -c shared_buffers=512MB -c work_mem=64MB -c maintenance_work_mem=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics"]
      interval: 3s
      retries: 30

  analytics:
    build: ./analytics
    env_file: .env
    depends_on:
      analytics-db: { condition: service_healthy }
    ports: ["8100:8100"]
    volumes:
      - ./analytics:/code
      - ../datasets:/data:ro
      - analytics_cache:/cache      # downloaded external sources (GTFS plans)
    command: uvicorn analytics.api:app --host 0.0.0.0 --port 8100 --reload

volumes:
  pgdata:
  uploads:
  analytics_pgdata:
  analytics_cache:
